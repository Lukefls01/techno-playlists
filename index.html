<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Techno-Playlists</title>
<meta name="theme-color" content="#0E0F0C">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine Spalte, Genre-Umschalter oben, darunter Favoriten, Playlists, DJ-Sets, neue Uploads; der Player schwebt unten. */
:root {
  color-scheme: dark;
  --bg: #0E0F0C;
  --surface: #181B16;
  --surface-2: #21251E;
  --surface-3: #2C3128;
  --line: rgba(241, 242, 236, 0.08);
  --fg: #F1F2EC;
  --muted: #A1A599;
  --accent: #C8F03C;
  --on-accent: #11140B;
  --accent-soft: rgba(200, 240, 60, 0.13);
  --danger: #FF9A8B;
  --danger-soft: rgba(255, 154, 139, 0.14);
  --font: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-card: 24px;
  --r-row: 14px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 76px; scroll-padding-bottom: calc(var(--dock-h, 260px) + 28px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.35;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(var(--dock-h, 260px) + 32px + env(safe-area-inset-bottom, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: default; opacity: 0.4; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
svg, img { display: block; }

.wrap { max-width: 980px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 24px; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }

.tabs-wrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding-block: 8px; background: linear-gradient(var(--bg) 78%, transparent); }
.tabs { display: flex; gap: 4px; padding: 4px; width: fit-content; max-width: 100%; background: var(--surface); border-radius: 999px; }
.tab { min-height: 44px; padding: 0 22px; border-radius: 999px; font-weight: 600; color: var(--muted); transition: background 0.15s, color 0.15s; }
.tab:hover { color: var(--fg); }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.notice { background: var(--surface); border-radius: 18px; padding: 14px 18px; font-size: 14px; line-height: 1.45; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }

.view { display: flex; flex-direction: column; gap: 36px; margin-top: 8px; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; align-items: center; gap: 8px; min-height: 44px; padding-left: 4px; }
.sec-head h2 { margin: 0; flex: 1; min-width: 0; font-size: 21px; font-weight: 700; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 500; transition: background 0.15s, color 0.15s; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.round { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); transition: background 0.15s, color 0.15s; }
.round:hover:not(:disabled) { background: var(--surface-2); color: var(--fg); }
.round[aria-pressed="true"] { color: var(--accent); }
.round--edit[aria-pressed="true"] { background: var(--accent-soft); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 16px; align-items: start; }
.card { background: var(--surface); border-radius: var(--r-card); padding: 8px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card--fav { background: linear-gradient(160deg, rgba(200, 240, 60, 0.15), rgba(200, 240, 60, 0.03) 55%), var(--surface); }
.card-head { display: flex; align-items: center; gap: 14px; padding: 10px 6px 10px 10px; }
.card-titles { flex: 1; min-width: 0; }
.card-titles h2, .card-titles h3 { margin: 0; font-size: 18px; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
.card-titles h2 { font-size: 21px; }
.meta { font-size: 13px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }

.play { flex: none; width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; transition: transform 0.12s; }
.play:active:not(:disabled) { transform: scale(0.94); }
.play--ghost { width: 44px; height: 44px; background: var(--surface-3); color: var(--fg); }

.row { display: flex; align-items: center; gap: 2px; border-radius: var(--r-row); transition: background 0.15s; }
.row:hover { background: var(--surface-2); }
.row.is-active { background: var(--accent-soft); }
.row-main { flex: 1; min-width: 0; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 8px 6px 8px 10px; text-align: left; border-radius: var(--r-row); }
.art { flex: none; position: relative; width: 44px; height: 44px; border-radius: 10px; overflow: hidden; background: var(--surface-3); color: var(--muted); display: grid; place-items: center; }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.art .now { position: absolute; inset: 0; display: none; place-items: center; background: rgba(14, 15, 12, 0.66); color: var(--accent); }
.row.is-playing .art .now { display: grid; }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row.is-active .row-title { color: var(--accent); }
.row-dur { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-inline: 6px; }
.row--set { gap: 12px; min-height: 64px; padding: 8px 6px 8px 10px; }

.hint { padding: 14px 12px; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.more { align-self: center; min-height: 44px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); }
.more:hover { background: var(--surface-2); color: var(--fg); }
.tools { display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding: 2px 2px 0; border-top: 1px solid var(--line); margin-top: 6px; }
.confirm { flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--danger-soft); color: var(--danger); font-size: 14px; font-weight: 600; }

.add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.add input { flex: 1 1 220px; min-width: 0; min-height: 50px; padding: 0 20px; background: var(--surface); border: 1px solid transparent; border-radius: 999px; color: var(--fg); }
.add input:focus { outline: none; border-color: var(--accent); }
.add input::placeholder { color: var(--muted); }
.add-msg { width: 100%; padding-left: 20px; font-size: 14px; color: var(--danger); }

.dock {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 10;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  width: min(calc(100% - 24px), 980px);
  background: rgba(31, 35, 28, 0.94);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-radius: 26px; padding: 8px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--line);
  display: flex; flex-direction: column; gap: 4px;
}
.dock-bar { display: flex; align-items: center; gap: 2px; min-height: 52px; }
.dock .art { width: 48px; height: 48px; border-radius: 14px; margin-right: 10px; }
.np { flex: 1; min-width: 0; padding-left: 2px; }
.np-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-time { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-inline: 8px; }
.dock .round { color: var(--fg); }
.dock .round[aria-pressed="true"] { color: var(--accent); }
.dock .round--play, .dock .round--play:hover:not(:disabled) { background: var(--accent); color: var(--on-accent); }

.seek { -webkit-appearance: none; appearance: none; display: block; width: calc(100% - 16px); height: 18px; margin: 0 8px; background: transparent; }
.seek::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(var(--accent), var(--accent)) 0 / var(--p, 0%) 100% no-repeat, var(--surface-3); }
.seek::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--accent); }
.seek::-moz-range-track { height: 4px; border-radius: 4px; background: var(--surface-3); }
.seek::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
.seek::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--accent); }
.seek:disabled { opacity: 0.4; }

.dock-frame { height: 166px; border-radius: 18px; overflow: hidden; background: var(--surface); }
.dock[data-tall] .dock-frame { height: min(340px, 38vh); }
.dock[data-size="closed"] .dock-frame { height: 6px; opacity: 0; pointer-events: none; }
.dock-frame iframe { display: block; width: 100%; height: 166px; border: 0; }
.dock[data-tall] .dock-frame iframe { height: 100%; }
.scout { position: fixed; left: -9999px; top: 0; width: 320px; height: 240px; border: 0; opacity: 0; pointer-events: none; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 11; bottom: calc(var(--dock-h, 260px) + 28px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 999px; }

@media (max-width: 560px) {
  .wrap { padding-inline: 16px; padding-block: 20px 16px; }
  h1 { font-size: 24px; }
  .tabs { width: 100%; }
  .tab { flex: 1; padding: 0 8px; }
  .view { gap: 30px; }
  .np-time, .dock .art, #btn-prev { display: none; }
  .np { padding-left: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Techno-Playlists</h1>
    <button type="button" class="round" id="btn-awake" aria-label="Bildschirm anlassen" aria-pressed="true" hidden></button>
  </div>
  <div class="tabs-wrap"><nav class="tabs" id="tabs" aria-label="Genre"></nav></div>
  <div class="notice" id="notice" hidden></div>
  <main class="view" id="view"></main>
</div>

<div class="dock" id="dock" data-size="open">
  <div class="dock-bar">
    <span class="art" id="np-art"></span>
    <div class="np">
      <div class="np-title" id="np-title">Wähle einen Track</div>
      <div class="np-sub" id="np-sub" hidden></div>
    </div>
    <div class="np-time" id="np-time"></div>
    <button type="button" class="round" id="btn-prev" aria-label="Vorheriger Titel" disabled></button>
    <button type="button" class="round round--play" id="btn-toggle" aria-label="Abspielen" disabled></button>
    <button type="button" class="round" id="btn-next" aria-label="Nächster Titel" disabled></button>
    <button type="button" class="round" id="btn-fav" aria-label="Zu Favoriten hinzufügen" aria-pressed="false" disabled></button>
    <button type="button" class="round" id="btn-size" aria-label="Player einklappen" aria-expanded="true"></button>
  </div>
  <input type="range" class="seek" id="seek" min="0" max="1000" value="0" aria-label="Position im Titel" disabled>
  <div class="dock-frame"><iframe id="player" title="SoundCloud-Player" allow="autoplay; encrypted-media" scrolling="no"></iframe></div>
</div>
<iframe class="scout" id="scout" title="Lädt Titellisten" aria-hidden="true" tabindex="-1"></iframe>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(function () {
'use strict';

/* ---------- Daten ---------- */

var CACHE_TTL = 6 * 60 * 60 * 1000;
var SHOW_ROWS = 8;

var GENRES = [
  { id: 'schranz', label: 'Schranz' },

  for (var i = 0; i < p.length; i++) s = s * 60 + p[i];

}
function P(path, title, by) { return { url: SC_BASE + path, title: title, by: by }; }

var DEFAULTS = {

  },

    ],

    ],

      S('trinityfr/trinity-hard-industrial-set', 'Trinity HARD INDUSTRIAL SET', 'Trinity', null),
      S('within-techno/trinity-b2b-within-area-df', 'TRINITY B2B WITHIN INDUSTRIAL TECHNO SET', 'WITHIN', '30:31'),

    ],

  }
};

  return '<svg width="' + (size || 20) + '" height="' + (size || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
}
var HEART = '<path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/>';
var ICONS = {

  pause: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.4"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.4"/></svg>',
  prev: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="3" height="14" rx="1.2"/><path d="M19.5 6v12a.8.8 0 0 1-1.25.66l-8.5-6a.8.8 0 0 1 0-1.32l8.5-6A.8.8 0 0 1 19.5 6z"/></svg>',
  next: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="16" y="5" width="3" height="14" rx="1.2"/><path d="M4.5 6v12a.8.8 0 0 0 1.25.66l8.5-6a.8.8 0 0 0 0-1.32l-8.5-6A.8.8 0 0 0 4.5 6z"/></svg>',
  heart: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">' + HEART + '</svg>',
  heartFill: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">' + HEART + '</svg>',

};

/* ---------- Speicher ---------- */
var storageOk = true;
function fresh() {
  var s = { v: 1, tab: 'schranz', newest: true, dock: 'open', sources: {}, favs: {} };
  GENRES.forEach(function (g) {
    s.sources[g.id] = JSON.parse(JSON.stringify(DEFAULTS[g.id]));
    s.favs[g.id] = [];
  });
  return s;
}
function loadState() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return fresh();
    var s = JSON.parse(raw);
    if (!s || s.v !== 1 || !s.sources || !s.favs) return fresh();
    GENRES.forEach(function (g) {
      var src = s.sources[g.id] || (s.sources[g.id] = {});
      ['playlists', 'sets', 'profiles'].forEach(function (k) { if (!Array.isArray(src[k])) src[k] = []; });
      if (!Array.isArray(s.favs[g.id])) s.favs[g.id] = [];
    });
    if (!genreLabel(s.tab)) s.tab = 'schranz';
    s.dock = (s.dock === 'off' || s.dock === 'closed') ? 'closed' : 'open';
    return s;
  } catch (e) { storageOk = false; return fresh(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { storageOk = false; }
}
function loadCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; } catch (e) { return {}; }
}
function saveCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) { /* Liste bleibt nur in dieser Sitzung */ }
}

/* ---------- Hilfen ---------- */
function $(id) { return document.getElementById(id); }
function el(tag, props, kids) {
  var n = document.createElement(tag), k, v;
  if (props) for (k in props) {
    v = props[k];
    if (v == null || v === false) continue;

    else if (k === 'text') n.textContent = v;

    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else n.setAttribute(k, v);

    confirmTimer = setTimeout(function () { confirmKey = null; render(); }, 4000);
    render();
    return;
  }
  confirmKey = null;
  clearTimeout(confirmTimer);
  var list = state.sources[genre][section];
  for (var i = 0; i < list.length; i++) if (list[i].url === url) {
    list.splice(i, 1);
    if (now && now.kind === 'set' && section === 'sets' && now.genre === genre) {
      if (now.index > i) now.index--;
      else if (now.index === i) now.index = i - 1;
    }
    break;
  }
  delete cache[url];
  saveCache();
  save();
  render();
}

/* ---------- Anzeige ---------- */
function artEl(t) {
  var box = el('span', { class: 'art', icon: 'note' });
  if (t && t.art) {
    var img = el('img', { src: t.art, alt: '', loading: 'lazy', decoding: 'async', referrerpolicy: 'no-referrer' });
    img.addEventListener('error', function () { if (img.parentNode) img.parentNode.removeChild(img); });
    box.appendChild(img);
  }
  box.appendChild(el('span', { class: 'now', icon: 'bars' }));
  return box;
}
function playBtn(cls, name, isLive, onclick, disabled) {
  var b = el('button', { class: cls, type: 'button', onclick: onclick, disabled: disabled });
  var upd = function () {
    var on = isLive() && playing;
    b.innerHTML = on ? ICONS.pause : ICONS.play;
    b.setAttribute('aria-label', name + (on ? ' anhalten' : ' abspielen'));
  };
  upd();
  marks.push(upd);
  return b;
}
function editBtn(section, name) {
  return el('button', {
    class: 'round round--edit', type: 'button', icon: 'edit', 'aria-pressed': editing[section] ? 'true' : 'false',
    'aria-label': name + ' bearbeiten',
    onclick: function () { editing[section] = !editing[section]; formMsg[section] = ''; render(); }
  });
}
function addForm(section) {
  var cfg = ADD[section], id = 'add-' + section;
  return el('form', {
    class: 'add', novalidate: true,
    onsubmit: function (e) { e.preventDefault(); addLink(section, $(id).value); }
  }, [
    el('input', { id: id, type: 'url', inputmode: 'url', autocomplete: 'off', spellcheck: 'false', placeholder: cfg.label + ' einfügen', 'aria-label': cfg.label }),
    el('button', { class: 'play', type: 'submit', icon: 'plus', 'aria-label': 'Hinzufügen' }),
    formMsg[section] ? el('div', { class: 'add-msg', role: 'alert', text: formMsg[section] }) : null
  ]);
}
function removeButton(genre, section, src) {
  var key = section + '|' + src.url;
  if (confirmKey === key) {
    return el('button', { class: 'confirm', type: 'button', text: 'Entfernen?', onclick: function () { removeSource(genre, section, src.url); } });
  }
  return el('button', {
    class: 'round', type: 'button', icon: 'x', 'aria-label': src.title + ' entfernen',
    onclick: function () { removeSource(genre, section, src.url); }
  });
}
function trackRow(t, genre, sub, onPlay, isActive) {
  var fav = favIndex(genre, t) >= 0;
  var row = el('div', { class: 'row' }, [
    el('button', { class: 'row-main', type: 'button', onclick: onPlay, 'aria-label': (t.title || 'Titel') + ' abspielen' }, [
      artEl(t),
      el('span', { class: 'row-text' }, [
        el('span', { class: 'row-title', text: t.title || 'Ohne Titel' }),
        sub ? el('span', { class: 'row-sub', text: sub }) : null
      ])
    ]),
    t.dur ? el('span', { class: 'row-dur', text: fmt(t.dur) }) : null,
    el('button', {
      class: 'round', type: 'button', icon: fav ? 'heartFill' : 'heart', 'aria-pressed': fav ? 'true' : 'false',
      'aria-label': fav ? 'Aus Favoriten entfernen' : 'Zu Favoriten hinzufügen',
      onclick: function () { toggleFav(genre, t); }
    })
  ]);
  var upd = function () {
    var a = isActive();
    row.classList.toggle('is-active', a);
    row.classList.toggle('is-playing', a && playing);
  };
  upd();
  marks.push(upd);
  return row;
}

function secFavs(g) {
  var list = state.favs[g], name = 'Favoriten ' + genreLabel(g);
  var isLive = function () { return !!(now && now.kind === 'fav' && now.genre === g); };
  var card = el('article', { class: 'card card--fav' }, [
    el('div', { class: 'card-head' }, [
      playBtn('play', name, isLive, function () { playList('fav', g, isLive() ? now.index : 0); }, !list.length),
      el('div', { class: 'card-titles' }, [el('h2', { text: name }), el('div', { class: 'meta', text: tracksWord(list.length) })]),
      editBtn('favs', name)
    ])
  ]);
  if (!list.length) card.appendChild(el('div', { class: 'hint', text: 'Tippe bei einem Track auf das Herz.' }));
  list.forEach(function (t, i) {
    card.appendChild(trackRow(t, g, t.artist, function () { playList('fav', g, i); }, function () { return isLive() && now.index === i; }));
  });
  return el('section', { class: 'sec' }, [card, editing.favs ? addForm('favs') : null]);
}
function sourceCard(g, section, src) {
  var c = cache[src.url], st = status[src.url], ed = !!editing[section];
  var isProfile = section === 'profiles';
  var isLive = function () { return !!(now && now.kind === 'source' && now.srcUrl === src.url); };
  var tracks = c ? c.tracks.slice() : [];
  if (!isProfile && state.newest) tracks.sort(function (a, b) { return (b.date || 0) - (a.date || 0) || a.i - b.i; });
  var meta = [isProfile ? '' : src.by, c ? tracksWord(c.total) : ''].filter(Boolean).join(' · ');

  var card = el('article', { class: 'card' }, [
    el('div', { class: 'card-head' }, [
      playBtn('play', src.title, isLive, function () { playSource(g, src, isLive() ? null : (tracks[0] || null)); }),
      el('div', { class: 'card-titles' }, [el('h3', { text: src.title }), meta ? el('div', { class: 'meta', text: meta }) : null])
    ])
  ]);

  if (tracks.length) {
    var open = !!expanded[src.url];
    (open ? tracks : tracks.slice(0, SHOW_ROWS)).forEach(function (t) {
      var sub = [t.artist, ago(t.date)].filter(Boolean).join(' · ');
      card.appendChild(trackRow(t, g, sub, function () { playSource(g, src, t); }, function () { return isLive() && !!now.sound && sameTrack(now.sound, t); }));
    });
    if (tracks.length > SHOW_ROWS) {
      card.appendChild(el('button', {
        class: 'more', type: 'button', text: open ? 'Weniger' : 'Alle ' + tracks.length + ' anzeigen',
        onclick: function () { expanded[src.url] = !expanded[src.url]; render(); }
      }));
    }
    if (c.total > tracks.length) card.appendChild(el('div', { class: 'hint', text: '+' + (c.total - tracks.length) + ' weitere im Player' }));
  } else if (api.failed) {
    card.appendChild(el('div', { class: 'hint', text: 'Titel siehst du im Player.' }));
  } else if (st !== 'loading' && (st === 'error' || c)) {
    card.appendChild(el('div', { class: 'hint' }, [
      'Keine Titel erhalten.',
      el('button', { class: 'more', type: 'button', text: 'Nochmal', onclick: function () { queueScout(src.url, true); pump(); render(); } })
    ]));
  } else {
    card.appendChild(el('div', { class: 'hint', text: 'Lädt …' }));
  }

  if (ed) {
    card.appendChild(el('div', { class: 'tools' }, [
      el('a', { class: 'round', href: src.url, target: '_blank', rel: 'noopener', icon: 'ext', 'aria-label': src.title + ' auf SoundCloud öffnen' }),
      api.ready ? el('button', {
        class: 'round', type: 'button', icon: 'refresh', disabled: st === 'loading', 'aria-label': src.title + ' neu laden',
        onclick: function () { queueScout(src.url, true); pump(); render(); }
      }) : null,
      removeButton(g, section, src)
    ]));
  }
  return card;
}
function secSources(g, section) {
  var list = state.sources[g][section];
  var isProfile = section === 'profiles';
  var name = isProfile ? 'Neu hochgeladen' : 'Playlists';
  var head = el('div', { class: 'sec-head' }, [
    el('h2', { text: name }),
    isProfile ? null : el('button', {
      class: 'chip', type: 'button', text: 'Neu zuerst', 'aria-pressed': state.newest ? 'true' : 'false',
      onclick: function () { state.newest = !state.newest; save(); render(); }
    }),
    editBtn(section, name)
  ]);
  var body = list.length
    ? el('div', { class: 'grid' }, list.map(function (src) { return sourceCard(g, section, src); }))
    : el('div', { class: 'card' }, el('div', { class: 'hint', text: 'Noch leer.' }));
  return el('section', { class: 'sec' }, [head, body, editing[section] ? addForm(section) : null]);
}
function secSets(g) {
  var list = state.sources[g].sets, ed = !!editing.sets;
  var card = el('article', { class: 'card' });
  if (!list.length) card.appendChild(el('div', { class: 'hint', text: 'Noch leer.' }));
  list.forEach(function (s, i) {
    var isLive = function () { return !!(now && now.kind === 'set' && now.genre === g && now.index === i); };
    var row = el('div', { class: 'row row--set' }, [
      playBtn('play play--ghost', s.title, isLive, function () { playList('set', g, i); }),
      el('span', { class: 'row-text' }, [
        el('span', { class: 'row-title', text: s.title }),
        s.by ? el('span', { class: 'row-sub', text: s.by }) : null
      ]),
      s.dur ? el('span', { class: 'row-dur', text: fmt(s.dur) }) : null,
      ed ? removeButton(g, 'sets', s) : null
    ]);
    var upd = function () { row.classList.toggle('is-active', isLive()); };
    upd();
    marks.push(upd);
    card.appendChild(row);
  });
  return el('section', { class: 'sec' }, [
    el('div', { class: 'sec-head' }, [el('h2', { text: 'DJ-Sets' }), editBtn('sets', 'DJ-Sets')]),
    card,
    ed ? addForm('sets') : null
  ]);
}

function renderTabs() {
  var nav = $('tabs');
  nav.textContent = '';
  GENRES.forEach(function (g) {
    nav.appendChild(el('button', {
      class: 'tab', type: 'button', text: g.label, 'aria-pressed': g.id === state.tab ? 'true' : 'false',
      onclick: function () {
        if (state.tab === g.id) return;
        state.tab = g.id;
        formMsg = {};
        save();
        ensureTracks(g.id);
        render();
        window.scrollTo(0, 0);
      }
    }));
  });
}
function renderNotice() {
  var n = $('notice'), lines = [];
  if (api.failed) lines.push('Der SoundCloud-Player antwortet nicht, deshalb fehlen Titel und Herzen. Schalte Werbeblocker aus und lade neu.');
  else if (location.protocol === 'file:') lines.push('Als Datei geöffnet. Starte die App über einen Webserver.');
  if (!storageOk) lines.push('Dein Browser speichert hier keine Favoriten.');
  n.textContent = '';
  lines.forEach(function (t) { n.appendChild(el('div', { text: t })); });
  n.hidden = !lines.length;
}
function renderDock() {
  var dock = $('dock'), s = now && now.sound;
  var open = state.dock !== 'closed' || api.failed;
  dock.setAttribute('data-size', open ? 'open' : 'closed');
  if (api.failed) dock.setAttribute('data-tall', ''); else dock.removeAttribute('data-tall');
  var size = $('btn-size');
  size.hidden = api.failed;
  size.innerHTML = open ? ICONS.down : ICONS.up;
  size.setAttribute('aria-label', open ? 'Player einklappen' : 'Player ausklappen');
  size.setAttribute('aria-expanded', open ? 'true' : 'false');
  $('btn-prev').innerHTML = ICONS.prev;
  $('btn-next').innerHTML = ICONS.next;
  $('btn-toggle').innerHTML = playing ? ICONS.pause : ICONS.play;
  $('btn-toggle').setAttribute('aria-label', playing ? 'Anhalten' : 'Abspielen');
  ['btn-prev', 'btn-toggle', 'btn-next', 'seek'].forEach(function (id) { $(id).disabled = !api.ready; });

  var title = s && s.title ? s.title : (now ? now.srcTitle : 'Wähle einen Track');
  var sub = s ? [s.artist, now.srcTitle].filter(Boolean).join(' · ') : '';
  $('np-title').textContent = title;
  $('np-title').title = title;
  $('np-sub').textContent = sub;
  $('np-sub').hidden = !sub;
  var a = (s && s.art) || '';
  if (a !== dockArt) {
    dockArt = a;
    var box = $('np-art');
    box.innerHTML = ICONS.note;
    if (a) {
      var img = el('img', { src: a, alt: '', referrerpolicy: 'no-referrer' });
      img.addEventListener('error', function () { if (img.parentNode) img.parentNode.removeChild(img); });
      box.appendChild(img);
    }
  }
  var favBtn = $('btn-fav'), can = !!(s && s.url), fav = can && favIndex(now.genre, s) >= 0;
  favBtn.disabled = !can;
  favBtn.innerHTML = fav ? ICONS.heartFill : ICONS.heart;
  favBtn.setAttribute('aria-pressed', fav ? 'true' : 'false');
  favBtn.setAttribute('aria-label', fav ? 'Aus Favoriten entfernen' : 'Zu Favoriten hinzufügen');
  var awake = $('btn-awake');
  awake.hidden = !(canWake && touch);
  awake.innerHTML = ICONS.sun;
  awake.setAttribute('aria-pressed', state.awake !== false ? 'true' : 'false');
  measureDock();
}
function measureDock() {
  document.documentElement.style.setProperty('--dock-h', $('dock').offsetHeight + 'px');
}
function mark() { for (var i = 0; i < marks.length; i++) marks[i](); }

var renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  (window.requestAnimationFrame || setTimeout)(function () {
    renderQueued = false;
    paint();
  });
}
function paint() {
  var keep = {}, focusId = document.activeElement && document.activeElement.id, sel = null;
  ['favs', 'playlists', 'sets', 'profiles'].forEach(function (s) {
    var i = $('add-' + s);
    if (i) keep[s] = i.value;
  });
  if (focusId && /^add-/.test(focusId)) {
    try { sel = [document.activeElement.selectionStart, document.activeElement.selectionEnd]; } catch (e) { sel = null; }
  }
  marks = [];
  renderTabs();
  renderNotice();
  var view = $('view'), g = state.tab;
  view.textContent = '';
  view.appendChild(secFavs(g));
  view.appendChild(secSources(g, 'playlists'));
  view.appendChild(secSets(g));
  view.appendChild(secSources(g, 'profiles'));
  Object.keys(keep).forEach(function (s) { var i = $('add-' + s); if (i && keep[s]) i.value = keep[s]; });
  if (focusId && /^add-/.test(focusId) && $(focusId)) {
    $(focusId).focus();
    if (sel) { try { $(focusId).setSelectionRange(sel[0], sel[1]); } catch (e) { /* type=url erlaubt das nicht überall */ } }
  }
  renderDock();
  if (location.hash.slice(1) !== g) { try { history.replaceState(null, '', '#' + g); } catch (e) { /* manche Umgebungen erlauben das nicht */ } }
}

/* ---------- Bedienung im Player ---------- */
$('btn-toggle').addEventListener('click', uiToggle);
$('btn-prev').addEventListener('click', function () { step(-1); });
$('btn-next').addEventListener('click', function () { step(1); });
$('btn-fav').addEventListener('click', function () { if (now && now.sound) toggleFav(now.genre, now.sound); });
$('btn-size').addEventListener('click', function () { state.dock = state.dock === 'closed' ? 'open' : 'closed'; save(); renderDock(); });
$('btn-awake').addEventListener('click', function () {
  state.awake = state.awake === false;
  save();
  syncWake();
  renderDock();
  toast(state.awake ? 'Bildschirm bleibt beim Abspielen an' : 'Bildschirm darf ausgehen');
});
$('seek').addEventListener('input', function () { seeking = true; this.style.setProperty('--p', (this.value / 10) + '%'); });
$('seek').addEventListener('change', function () {
  var dur = duration();
  if (api.ready && dur) main.seekTo(dur * this.value / 1000);
  seeking = false;
});
window.addEventListener('resize', measureDock);

initPlayer();
paint();
})();
</script>
</body>
</html>
